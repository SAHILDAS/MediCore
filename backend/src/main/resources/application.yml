spring:

  datasource:

    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:medicore}

    username: ${POSTGRES_USER:medicore}

    password: ${POSTGRES_PASSWORD:medicore123}

    driver-class-name: org.postgresql.Driver

  data:

    redis:

      host: localhost

      port: ${REDIS_PORT:6379}

  flyway:

    enabled: true

    locations: classpath:db/migration

  jpa:

    hibernate:

      ddl-auto: validate

    open-in-view: false