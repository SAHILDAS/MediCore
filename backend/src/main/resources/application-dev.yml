spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medicore
    username: medicore
    password: medicore
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379