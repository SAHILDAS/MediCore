version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: medicore-postgres
    restart: unless-stopped

    env_file:
      - ../../env/development.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - medicore-network

  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    restart: unless-stopped

    env_file:
      - ../../env/development.env

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - medicore-network

volumes:
  postgres-data:
    name: medicore-postgres-data

  redis-data:
    name: medicore-redis-data

networks:
  medicore-network:
    name: medicore-network
    driver: bridge